name: Validate Plugin Switch
on:
  push:
    branches: [dev, main]
  pull_request:
env:
  PLUGIN_SWITCH_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-xml
      - name: Lint PHP
        run: |
          php -l src/Controller.php
          php -l src/api.php
      - name: Validate JavaScript
        run: node --check src/switch.js
      - name: Test controller behavior
        run: php tests/controller_test.php
      - name: Verify capability discovery and audited profile lifecycle
        run: sudo php tests/compatibility_test.php
      - name: Validate generated manifest
        run: |
          python3 tools/build.py --check
          python3 -m unittest discover -s tests -v
